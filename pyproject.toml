[project]
name = "bitrix24-minimal-bot"
version = "0.1.0"
description = "Minimal synchronous Bitrix24 Chat Bot v2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.scripts]
bitrix-bot = "bitrix_bot.main:main"
bitrix-register-bot = "scripts.register_bot:main"
bitrix-unregister-bot = "scripts.unregister_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitrix_bot", "scripts"]
